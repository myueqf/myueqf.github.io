<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>
    <div class="container">
        <h1>全部 | 阿洇の小说站～</h1>
        <div id="bookList" class="book-list">
            <p class="loading-message">猫猫正在努力加载～</p>

    <script src="js/live2d.config.js"></script>
    <script src="../js/QAQ.js"></script>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const paramValue = urlParams.get('list');
            const scriptName = paramValue ? `${paramValue}.js` : 'default.js';
            const scriptSrc = `script/${scriptName}`;
            const script = document.createElement('script');
            script.src = scriptSrc;
            script.async = true;
            document.head.appendChild(script);
        })();
    </script>
    <script src="../js/jszip.min.js"></script>
</body>
