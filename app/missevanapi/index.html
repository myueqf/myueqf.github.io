<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫耳FM字幕在线提取</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-3xl mx-auto bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-bold text-white">猫耳FM字幕在线提取</h1>
            <p class="text-gray-400 mt-2">将广播剧字幕保存为 LRC 文件。</p>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <label for="fm-id" class="block text-sm font-medium text-gray-300">请输入广播剧 Sound ID:</label>
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="fm-id" name="fm-id" placeholder="例如: 7269155" class="flex-grow bg-gray-700 border border-gray-600 text-white placeholder-gray-400 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3 transition">
                <button id="generate-btn" class="btn-primary w-full sm:w-auto">
                    <span id="btn-text">提取</span>
                    <span id="loader" class="hidden">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        处理中...
                    </span>
                </button>
            </div>
        </div>

        <!-- Status Message -->
        <div id="status-message" class="text-center text-sm p-3 rounded-lg hidden"></div>

        <!-- Results Section -->
        <div id="results-container" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-white">生成结果</h2>
                <div class="flex gap-3">
                    <button id="copy-btn" class="btn-secondary text-sm">复制</button>
                    <button id="download-btn" class="btn-secondary text-sm">下载 .lrc</button>
                </div>
            </div>
            <textarea id="lrc-output" readonly class="w-full h-80 bg-gray-900 text-gray-300 font-mono text-sm p-4 rounded-lg border border-gray-700 focus:ring-indigo-500 focus:border-indigo-500 transition"></textarea>
        </div>

    </div>

<script src="js/app.js"></script>
</body>
</html>
